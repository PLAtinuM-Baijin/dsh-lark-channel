# feishu-channel bundle：channel 插件 + 每晚记忆整理插件 + 三个 agent preset。
# 装到某个 profile 后，profile 启动即连飞书；一行 fire-and-forget，不需要 MCP 轮询。

- insert:
    # 常驻 channel：连接、按 chat 路由、触发 agent 回合，都在这个插件里。
    - id: feishu-channel
      name: '@local/dsh-feishu-channel'
      config:
        # 密钥不要写进 YAML：Loader 在激活时对这段表达式求值。
        appId: !!js process.env.FEISHU_APP_ID
        appSecret: !!js process.env.FEISHU_APP_SECRET
        cwd: !!js process.env.FEISHU_CWD
        agentPreset: feishu
        # 主人私聊单独用高权限 preset；chat_id 来自飞书事件，消息内容改不了路由。
        ownerChatId: !!js (process.env.FEISHU_OWNER_CHAT_ID || '')
        ownerPreset: feishu-power
        # 一轮里没有新产出/新消息时的等待上限；有新消息或新产出会重新计时。
        replyTimeoutMs: 180000
        ownerReplyTimeoutMs: 900000
        # 单轮绝对上限（含中途追加消息）；避免群聊刷屏把一轮无限延长。
        maxTurnMs: 1800000
        # 流式卡片：飞书端打字机效果；关掉就退回每步一条普通富文本消息。
        cardStreaming: !!js (process.env.FEISHU_CARD_STREAMING || 'true') !== 'false'
        # 网页面板里在当天主人会话中发起的对话，同步镜像到飞书（问题带 [user asked from web]）。
        syncWebToFeishu: !!js (process.env.FEISHU_SYNC_WEB || 'true') !== 'false'
        # 定时任务落盘位置；空字符串时用 ~/.dsh-feishu-schedules.json。
        scheduleFile: !!js (process.env.FEISHU_SCHEDULE_FILE || '')
        # 本地聊天历史（含 message_id）；空字符串时用 ~/.dsh-feishu-history。
        historyDir: !!js (process.env.FEISHU_HISTORY_DIR || '')
        requireMentionInGroup: true
        # 空白名单 = 谁都不回；首次接入时看日志里的 chat= / sender=，再填这两个环境变量。
        allowedChatIds: !!js (process.env.FEISHU_ALLOWED_CHAT_IDS || '').split(',')
        allowedOpenIds: !!js (process.env.FEISHU_ALLOWED_OPEN_IDS || '').split(',')
        sessionPrefix: feishu-
        timeZone: Asia/Shanghai
        logLevel: info

    # 每晚的顶层记忆整理：读最近会话 → 让 feishu-root 用 feishu_memory 工具整理。
    - id: feishu-memory-curator
      name: '@local/dsh-feishu-channel/memory-curator'
      config:
        memoryDir: !!js (process.env.FEISHU_MEMORY_DIR || '')
        curatorTime: !!js (process.env.FEISHU_CURATOR_TIME || '03:17')

    # 控制面板：Host JSON 路由 + 浏览器 bundle。单独的包（ui/package.json），
    # 因为 channel 包里已有两个 Loader 条目指向同一 package.json，不能再声明 dsh.client。
    - id: feishu-panel
      name: /home/ubuntu/feishu-channel/ui/index.js

    # 这个 preset 决定飞书会话能用什么：没有 shell、没有文件读写、没有 jobs。
    - id: preset-feishu
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: feishu
        name: 飞书机器人
        description: 纯对话：无 shell、无文件读写、无后台任务。
        order: 20
        plugins:
          # 从 FEISHU_CWD/AGENTS.md 加载守则；dsh-base 里这一行默认 disabled。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是部署在飞书里的对话机器人。默认用中文，先给结论，再给理由。
                飞书消息按 Markdown 渲染（CommonMark + GFM），可用标题、列表、表格和代码块，但要克制。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # 每次请求前注入：全局记忆 + 本 chat 的记忆（只读）。
          - id: memory-context
            name: '@local/dsh-feishu-channel/memory-context'
            config:
              memoryDir: !!js (process.env.FEISHU_MEMORY_DIR || '')
          # 记忆读写工具；作用域守卫在插件里硬编码。
          - id: memory-tool
            name: '@local/dsh-feishu-channel/memory-tool'
            config:
              memoryDir: !!js (process.env.FEISHU_MEMORY_DIR || '')
              ownerChatId: !!js (process.env.FEISHU_OWNER_CHAT_ID || '')
          # 每轮注入最近聊天记录（含 message_id），让模型知道该引用哪句。
          - id: history-context
            name: '@local/dsh-feishu-channel/history-context'
            config:
              historyDir: !!js (process.env.FEISHU_HISTORY_DIR || '')
          # 模型选择发送方式：引用回复某条，或直接发一条新消息。
          - id: reply-tool
            name: '@local/dsh-feishu-channel/reply-tool'
          # web 模板把压缩后端禁用了，preset 自己挂一份，长会话才不会无限膨胀。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    # 主人私聊专用：等同一个跑在服务器上的 agent，工具齐全。
    - id: preset-feishu-power
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: feishu-power
        name: 飞书机器人（owner 全权限）
        description: 主人私聊专用：shell、文件、搜索、网页、后台任务、子代理、发文件回飞书。
        order: 22
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是部署在飞书里的主人专属服务器助手。默认用中文，先给结论，再给理由。
                飞书消息按 Markdown 渲染（CommonMark + GFM），可用标题、列表、表格和代码块，但要克制。
          # 主人版守则：能力、执行边界、密钥卫生、防注入。群聊继续用 AGENTS.md。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              instructionFileCandidates:
                - POWER.md
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: memory-context
            name: '@local/dsh-feishu-channel/memory-context'
            config:
              memoryDir: !!js (process.env.FEISHU_MEMORY_DIR || '')
          - id: memory-tool
            name: '@local/dsh-feishu-channel/memory-tool'
            config:
              memoryDir: !!js (process.env.FEISHU_MEMORY_DIR || '')
              ownerChatId: !!js (process.env.FEISHU_OWNER_CHAT_ID || '')
          # 每轮注入最近聊天记录（含 message_id），让模型知道该引用哪句。
          - id: history-context
            name: '@local/dsh-feishu-channel/history-context'
            config:
              historyDir: !!js (process.env.FEISHU_HISTORY_DIR || '')
          # 模型选择发送方式：引用回复某条，或直接发一条新消息。
          - id: reply-tool
            name: '@local/dsh-feishu-channel/reply-tool'
          # 飞书 MCP（文档/日历/任务/wiki/通讯录/读消息）；只挂给 owner 私聊。
          # 收消息和回复仍由 channel 负责，MCP 不开 WS、不发消息。
          - id: mcp-client-feishu
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: stdio
              serverName: feishu
              command: node
              args:
                - /home/ubuntu/lark-mcp-dsh/node_modules/tsx/dist/cli.mjs
                - /home/ubuntu/lark-mcp-dsh/src/index.ts
              env:
                LARK_APP_ID: !!js process.env.FEISHU_APP_ID
                LARK_APP_SECRET: !!js process.env.FEISHU_APP_SECRET
                LARK_TIMEZONE: Asia/Shanghai
                LARK_OWNER_OPEN_ID: !!js (process.env.FEISHU_ALLOWED_OPEN_IDS || '').split(',')[0]
              cwd: /home/ubuntu/lark-mcp-dsh
              # OAuth 设备码流程会在工具调用里阻塞最多 10 分钟，留足余量。
              toolCallTimeoutMs: 660000
          # 把服务器上的文件/图片发回飞书；只挂在这里，群聊 preset 没有。
          - id: send-file
            name: '@local/dsh-feishu-channel/send-file'
            config:
              appId: !!js process.env.FEISHU_APP_ID
              appSecret: !!js process.env.FEISHU_APP_SECRET
              ownerChatId: !!js (process.env.FEISHU_OWNER_CHAT_ID || '')
              cwd: !!js (process.env.FEISHU_CWD || '')
          # 主动发一条新消息（不引用消息）；同样只给 owner 私聊。
          - id: send-text
            name: '@local/dsh-feishu-channel/send-text'
            config:
              ownerChatId: !!js (process.env.FEISHU_OWNER_CHAT_ID || '')
              allowedChatIds: !!js (process.env.FEISHU_ALLOWED_CHAT_IDS || '').split(',')
          # 定时任务：到点唤醒聊天当天会话，回复作为新消息发出。
          - id: schedule-tool
            name: '@local/dsh-feishu-channel/schedule-tool'
            config:
              ownerChatId: !!js (process.env.FEISHU_OWNER_CHAT_ID || '')
              allowedChatIds: !!js (process.env.FEISHU_ALLOWED_CHAT_IDS || '').split(',')
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

    # 顶层整理会话（feishu-root）专用：只注入全局记忆，可跨 chatId 操作。
    - id: preset-feishu-curator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: feishu-curator
        name: 飞书记忆整理员
        description: 只整理记忆：无 shell、无文件读写、不对外发消息。
        order: 21
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是飞书机器人的记忆整理员。每次任务给你一批对话摘要，
                你只负责用 feishu_memory 工具写入、合并、清理长期记忆，不做其他事。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: memory-context
            name: '@local/dsh-feishu-channel/memory-context'
            config:
              memoryDir: !!js (process.env.FEISHU_MEMORY_DIR || '')
          - id: memory-tool
            name: '@local/dsh-feishu-channel/memory-tool'
            config:
              memoryDir: !!js (process.env.FEISHU_MEMORY_DIR || '')
              ownerChatId: !!js (process.env.FEISHU_OWNER_CHAT_ID || '')
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
